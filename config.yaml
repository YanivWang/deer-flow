# DeerFlow Configuration
# Generated by 'make setup' on 2026-07-29
# Run 'make setup' to reconfigure, or edit this file for advanced options.
# Full reference: config.example.yaml

config_version: 31
log_level: info
logging:
  enhance:
    enabled: false
    format: text
token_usage:
  enabled: true
token_budget:
  enabled: false
  max_tokens: 200000
  max_input_tokens: null
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0
max_recursion_limit: 1000
models:
- name: MiniMax-M3
  display_name: MiniMax CN / MiniMax-M3
  use: langchain_openai:ChatOpenAI
  model: MiniMax-M3
  api_key: $MINIMAX_API_KEY
  base_url: https://api.minimaxi.com/v1
  request_timeout: 600.0
  max_retries: 2
  max_tokens: 4096
  temperature: 1.0
  supports_vision: true
  supports_thinking: true
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
- name: browser
tools:
- name: web_search
  use: deerflow.community.tavily.tools:web_search_tool
  group: web
  max_results: 5
- name: web_fetch
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  group: web
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  use: deerflow.sandbox.tools:write_file_tool
  group: file:write
- name: str_replace
  use: deerflow.sandbox.tools:str_replace_tool
  group: file:write
- name: bash
  use: deerflow.sandbox.tools:bash_tool
  group: bash
tool_search:
  enabled: false
  auto_promote_top_k: 3
tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: .tool-results
  exempt_tools:
  - read_file
  - read_file_tool
suggestions:
  enabled: true
  max_suggestions: 3
input_polish:
  enabled: true
  max_chars: 4000
  model_name: null
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
read_before_write:
  enabled: true
safety_finish_reason:
  enabled: true
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
  bash_command_timeout: 600
  environment:
    MINIMAX_API_KEY: $MINIMAX_API_KEY
    IMAGE_GENERATION_PROVIDER: minimax
    MINIMAX_API_HOST: https://api.minimaxi.com
skills:
  container_path: /mnt/skills
skill_scan:
  enabled: true
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 32000
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  injection_enabled: true
  shutdown_flush_timeout_seconds: 30.0
  manager_class: deermem
  mode: middleware
  backend_config:
    storage_path: ''
    storage_class: file
    strict_user_scope: false
    manifest_filename: memory.json
    file_lock_timeout_seconds: 10
    retrieval_adapter: fts5
    debounce_seconds: 30
    queue_max_depth: 1000
    model: null
    max_facts: 100
    fact_confidence_threshold: 0.7
    max_injection_tokens: 2000
    token_counting: tiktoken
    guaranteed_categories:
    - correction
    guaranteed_token_budget: 500
    staleness_review_enabled: true
    staleness_age_days: 90
    staleness_min_candidates: 3
    staleness_max_removals_per_cycle: 10
    staleness_protected_categories:
    - correction
    staleness_max_lifetime_multiplier: 20.0
    staleness_max_extension_days: 3650
    consolidation_enabled: false
    consolidation_min_facts: 8
    consolidation_max_groups_per_cycle: 3
    consolidation_max_sources: 8
agents_api:
  enabled: false
skill_evolution:
  enabled: false
  moderation_model_name: null
  security_fail_closed: true
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
  pool_recycle: 300
  command_timeout: 30
  checkpoint_channel_mode: full
  checkpoint_delta:
    snapshot_frequency: 10
  checkpoint_graph_cache:
    accessor_graph_max: 64
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true
agent_storage:
  backend: file
scheduler:
  enabled: false
  poll_interval_seconds: 5
  lease_seconds: 120
  max_concurrent_runs: 3
  min_once_delay_seconds: 60
run_ownership:
  lease_seconds: 30
  grace_seconds: 10
  heartbeat_enabled: false
authorization:
  enabled: false
channel_connections:
  enabled: true
  telegram:
    enabled: true
  slack:
    enabled: true
  discord:
    enabled: true
  feishu:
    enabled: true
  dingtalk:
    enabled: true
  wechat:
    enabled: true
  wecom:
    enabled: true
