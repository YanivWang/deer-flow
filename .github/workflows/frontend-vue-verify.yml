name: frontend-vue verify

on:
  push:
    paths:
      - "frontend-vue/**"
      - "frontend/tests/e2e/**"
      - "frontend/tests/e2e-auth/**"
      - "frontend/tests/e2e-real-backend/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/app/gateway/**"
      - "backend/packages/harness/deerflow/runtime/**"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/tests/fixtures/replay/**"
      - "backend/tests/replay_provider.py"
      - "backend/tests/_replay_fixture.py"
      - "backend/tests/seed_runs_router.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - "backend/tests/test_pnpm_script.py"
      - "backend/tests/test_frontend_vue_startup.py"
      - ".github/workflows/frontend-vue-verify.yml"
  pull_request:
    paths:
      - "frontend-vue/**"
      - "frontend/tests/e2e/**"
      - "frontend/tests/e2e-auth/**"
      - "frontend/tests/e2e-real-backend/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/app/gateway/**"
      - "backend/packages/harness/deerflow/runtime/**"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/tests/fixtures/replay/**"
      - "backend/tests/replay_provider.py"
      - "backend/tests/_replay_fixture.py"
      - "backend/tests/seed_runs_router.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - "backend/tests/test_pnpm_script.py"
      - "backend/tests/test_frontend_vue_startup.py"
      - ".github/workflows/frontend-vue-verify.yml"

  workflow_dispatch:

concurrency:
  group: fe-vue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      # Shared specs resolve @playwright/test from frontend/node_modules.
      # Install that physical instance before resolving frontend-vue's link: dependency.
      - name: Install React contract-test host
        run: python3 scripts/pnpm.py install --frozen-lockfile

      - name: Assert shared Playwright host exists
        run: test -f frontend/node_modules/@playwright/test/package.json

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Run fast verification
        working-directory: frontend-vue
        run: make verify

      - name: Audit dependency advisories
        working-directory: frontend-vue
        run: make audit

      - name: Smoke-test production container
        working-directory: frontend-vue
        run: make container-smoke

      - name: Verify contract test inventory
        working-directory: frontend-vue
        run: make e2e-list

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      # Keep infrastructure smoke explicit, then run the Vue-owned full inventory.
      # Framework-specific behavior lives in frontend-vue specs;
      # only framework-neutral product contracts are reused from frontend.
      - name: Run preview proxy and auth-disabled smoke
        working-directory: frontend-vue
        run: make proxy-smoke auth-disabled-smoke

      - name: Run Button visual and splitpanes smoke
        working-directory: frontend-vue
        run: make visual-baseline-smoke splitpanes-smoke

      - name: Run the full Vue product gate
        working-directory: frontend-vue
        run: make e2e-m7

  real-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install replay Gateway dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install React contract-test host
        run: python3 scripts/pnpm.py install --frozen-lockfile

      - name: Assert shared Playwright host exists
        run: test -f frontend/node_modules/@playwright/test/package.json

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run the complete replay-Gateway suite
        working-directory: frontend-vue
        run: make e2e-m0

  # G0-6 (browser WebSocket) and G0-7 (OIDC dual callback). Separate from the
  # real-backend job only because these need the backend browser extra and a
  # Gateway whose toolset includes browser_navigate, which changes the system
  # prompt and would break the run-protocol replay fixture's hash. Both are
  # hermetic — the IdP is tests/support/run_m0_idp.py, no external service.
  external-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install replay Gateway and browser dependencies
        working-directory: backend
        run: |
          uv sync --group dev --extra browser
          uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install React contract-test host
        run: python3 scripts/pnpm.py install --frozen-lockfile

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run browser WebSocket and OIDC gates
        working-directory: frontend-vue
        run: make e2e-external
