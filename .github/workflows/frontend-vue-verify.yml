name: frontend-vue verify

on:
  push:
    paths:
      - "frontend-vue/**"
      - "frontend/tests/e2e/**"
      - "frontend/tests/e2e-auth/**"
      - "frontend/tests/e2e-real-backend/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/app/gateway/**"
      - "backend/packages/harness/deerflow/runtime/**"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/tests/fixtures/replay/**"
      - "backend/tests/replay_provider.py"
      - "backend/tests/_replay_fixture.py"
      - "backend/tests/seed_runs_router.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - "backend/tests/test_pnpm_script.py"
      - "backend/tests/test_frontend_vue_startup.py"
      - "frontend-vue-build-docs/**"
      - ".github/workflows/frontend-vue-verify.yml"
  pull_request:
    paths:
      - "frontend-vue/**"
      - "frontend/tests/e2e/**"
      - "frontend/tests/e2e-auth/**"
      - "frontend/tests/e2e-real-backend/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "backend/app/gateway/**"
      - "backend/packages/harness/deerflow/runtime/**"
      - "backend/scripts/run_replay_gateway.py"
      - "backend/tests/fixtures/replay/**"
      - "backend/tests/replay_provider.py"
      - "backend/tests/_replay_fixture.py"
      - "backend/tests/seed_runs_router.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "scripts/pnpm.py"
      - "scripts/serve.sh"
      - "Makefile"
      - "backend/tests/test_pnpm_script.py"
      - "backend/tests/test_frontend_vue_startup.py"
      - "frontend-vue-build-docs/**"
      - ".github/workflows/frontend-vue-verify.yml"

  # G0-6 (browser WebSocket) and G0-7 (OIDC dual callback) need a browser
  # runtime and a controlled IdP that no push/PR runner provides. They get an
  # explicit manual entry point instead of silently having no automation at all.
  workflow_dispatch:
    inputs:
      run_external_gates:
        description: "Run the G0-6/G0-7 external gates (needs a browser runtime and a controlled IdP)"
        type: boolean
        default: false

concurrency:
  group: fe-vue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect frontend-vue project
        id: project
        shell: bash
        run: |
          if [[ -f frontend-vue/package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain pre-project skip
        if: steps.project.outputs.exists != 'true'
        run: echo "frontend-vue/package.json does not exist yet; workflow wiring is ready for M0."

      - name: Set up Node.js
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        if: steps.project.outputs.exists == 'true'
        run: corepack enable

      # Shared specs resolve @playwright/test from frontend/node_modules.
      # Install that physical instance before resolving frontend-vue's link: dependency.
      - name: Install React contract-test host
        if: steps.project.outputs.exists == 'true'
        run: python3 scripts/pnpm.py install --frozen-lockfile

      - name: Assert shared Playwright host exists
        if: steps.project.outputs.exists == 'true'
        run: test -f frontend/node_modules/@playwright/test/package.json

      - name: Install frontend-vue dependencies
        if: steps.project.outputs.exists == 'true'
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Run fast verification
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make verify

      - name: Audit dependency advisories
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make audit

      - name: Smoke-test production container
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make container-smoke

      - name: Verify contract test inventory
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make e2e-list

      - name: Install Playwright Chromium
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make e2e-install

      # M0 owns infrastructure only. The full shared business contract remains
      # collected above and is executed incrementally as M1-M7 implement it.
      - name: Run M0 preview proxy and auth-disabled smoke
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make proxy-smoke auth-disabled-smoke

      - name: Run M0 Button visual seed and splitpanes spike
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make visual-baseline-smoke splitpanes-smoke

  real-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect frontend-vue project
        id: project
        shell: bash
        run: |
          if [[ -f frontend-vue/package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain pre-project skip
        if: steps.project.outputs.exists != 'true'
        run: echo "frontend-vue/package.json does not exist yet; real-backend job is waiting for M0."

      - name: Set up Python
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.project.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install replay Gateway dependencies
        if: steps.project.outputs.exists == 'true'
        working-directory: backend
        run: uv sync --group dev

      - name: Set up Node.js
        if: steps.project.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        if: steps.project.outputs.exists == 'true'
        run: corepack enable

      - name: Install React contract-test host
        if: steps.project.outputs.exists == 'true'
        run: python3 scripts/pnpm.py install --frozen-lockfile

      - name: Assert shared Playwright host exists
        if: steps.project.outputs.exists == 'true'
        run: test -f frontend/node_modules/@playwright/test/package.json

      - name: Install frontend-vue dependencies
        if: steps.project.outputs.exists == 'true'
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run the complete repository-runnable M0 suite
        if: steps.project.outputs.exists == 'true'
        working-directory: frontend-vue
        run: make e2e-m0

  # G0-6 / G0-7. Manual only, and it fails loudly on a missing prerequisite
  # rather than skipping — a skipped external gate is what let these two stay
  # unproven with no automation pointing at them.
  external-gates:
    if: github.event_name == 'workflow_dispatch' && inputs.run_external_gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      M0_BROWSER_RUNTIME_URL: ${{ vars.M0_BROWSER_RUNTIME_URL }}
      M0_OIDC_ISSUER: ${{ secrets.M0_OIDC_ISSUER }}
      M0_OIDC_CLIENT_ID: ${{ secrets.M0_OIDC_CLIENT_ID }}
      M0_OIDC_CLIENT_SECRET: ${{ secrets.M0_OIDC_CLIENT_SECRET }}
      M0_OIDC_REACT_CALLBACK: ${{ vars.M0_OIDC_REACT_CALLBACK }}
      M0_OIDC_VUE_CALLBACK: ${{ vars.M0_OIDC_VUE_CALLBACK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Assert external prerequisites are configured
        shell: bash
        run: |
          missing=()
          for name in M0_BROWSER_RUNTIME_URL M0_OIDC_ISSUER M0_OIDC_CLIENT_ID \
                      M0_OIDC_CLIENT_SECRET M0_OIDC_REACT_CALLBACK M0_OIDC_VUE_CALLBACK; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::G0-6/G0-7 cannot run. Missing: ${missing[*]}." \
                 "G0-6 needs a Gateway with browser control plus a reachable browser runtime;" \
                 "G0-7 needs a controlled IdP with separate React and Vue callback URIs."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install replay Gateway dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install React contract-test host
        run: python3 scripts/pnpm.py install --frozen-lockfile

      - name: Install frontend-vue dependencies
        run: python3 scripts/pnpm.py --dir frontend-vue install --frozen-lockfile --strict-peer-dependencies

      - name: Install Playwright Chromium
        working-directory: frontend-vue
        run: make e2e-install

      - name: Run the external M0 gates
        working-directory: frontend-vue
        run: make e2e-external
