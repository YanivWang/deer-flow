name: frontend-vue verify

on:
  push:
    paths:
      - "frontend-vue/**"
      - ".github/workflows/frontend-vue-verify.yml"
  pull_request:
    paths:
      - "frontend-vue/**"
      - ".github/workflows/frontend-vue-verify.yml"

concurrency:
  group: fe-vue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Enable Corepack
        run: corepack enable

      - name: Install pinned pnpm dependencies
        run: corepack pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run fast verification
        run: make verify

      - name: Install Playwright Chromium
        run: make e2e-install

      # testDir points at ../frontend/tests/e2e -- the contract specs are shared
      # with the React frontend and treated as read-only. See
      # frontend-vue-build-docs/03-project-shape.md.
      - name: Run contract E2E suite
        run: make e2e
