name: deer-flow-vue-dev

services:
  frontend-vue-dev:
    build:
      context: ../
      dockerfile: frontend-vue/Dockerfile
      target: deps
    container_name: deer-flow-frontend-vue-dev
    command: ["corepack", "pnpm", "exec", "nuxt", "dev", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "${VUE_DEV_PORT:-2028}:3000"
    environment:
      - NUXT_GATEWAY_URL=${VUE_GATEWAY_URL:-http://gateway:8001}
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
    volumes:
      - ../frontend-vue/.nuxtrc:/app/.nuxtrc:ro
      - ../frontend-vue/nuxt.config.ts:/app/nuxt.config.ts:ro
      - ../frontend-vue/tsconfig.json:/app/tsconfig.json:ro
      - ../frontend-vue/app:/app/app
      - ../frontend-vue/config:/app/config
      - ../frontend-vue/server:/app/server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - deer-flow
    restart: unless-stopped

networks:
  deer-flow:
    external: true
    name: ${DEER_FLOW_NETWORK:-deer-flow_deer-flow}
